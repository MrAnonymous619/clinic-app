# Prometheus runs on the EC2 host and reaches Minikube through "kubectl proxy" (port 8001).
global:
  scrape_interval: 15s
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets: ["localhost:9090"]
- job_name: node
  static_configs:
  - targets: ["localhost:9100"]
- job_name: clinic-app
  metrics_path: /api/v1/namespaces/clinic/services/clinic-svc:http/proxy/metrics
  static_configs:
  - targets: ["localhost:8001"]
- job_name: kube-state-metrics
  metrics_path: /api/v1/namespaces/kube-system/services/kube-state-metrics:http-metrics/proxy/metrics
  static_configs:
  - targets: ["localhost:8001"]
- job_name: cadvisor
  metrics_path: /api/v1/nodes/minikube/proxy/metrics/cadvisor
  static_configs:
  - targets: ["localhost:8001"]
