apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinic-hpa
  namespace: clinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinic-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      # Shorter than the default 300s so scale-down is visible during the demo
      stabilizationWindowSeconds: 60
