apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-app
  namespace: clinic
  labels:
    app: clinic-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinic-app
  template:
    metadata:
      labels:
        app: clinic-app
    spec:
      containers:
      - name: clinic-app
        # Replace arnmk with your Docker Hub username (see README)
        image: arnmk/clinic-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        # CPU requests are REQUIRED: the HPA calculates utilization as a % of the request
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
