name: ci
# Push trigger: runs on every push to the main branch (or manually from the Actions tab)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-app:${{ github.sha }}

      - name: Notify Slack (only if everything above succeeded)
        if: success()
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s --fail-with-body -X POST -H "Content-type: application/json" \
            --data '{"text":"Pipeline succeeded for ${{ github.repository }}. Image pushed to Docker Hub (commit ${{ github.sha }})."}' \
            "$SLACK_URL"
