name: ci
# Push trigger: runs on every push to the main branch (or manually from the Actions tab)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-app:${{ github.sha }}

      - name: Notify WhatsApp (only if everything above succeeded)
        if: success()
        env:
          SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/$SID/Messages.json" \
            --data-urlencode "From=whatsapp:${{ secrets.TWILIO_WHATSAPP_FROM }}" \
            --data-urlencode "To=whatsapp:${{ secrets.TWILIO_WHATSAPP_TO }}" \
            --data-urlencode "Body=Pipeline succeeded. Image pushed to Docker Hub (commit ${{ github.sha }})." \
            -u "$SID:$TOKEN"
